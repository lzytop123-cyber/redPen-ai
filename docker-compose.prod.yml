services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhixingdao_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 持久化数据库（含 1191 道真题）与用户上传的手写答卷原图
      - ./data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: zhixingdao_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
