# 独立站点 ai.islandspace.top。
# 不要并进 islandspace.top 或 admin.islandspace.top 的 server。
# 只反代 127.0.0.1:8001。不要把 upstream 改成 8000，不要修改 zxd-backend。

server {
    listen 80;
    server_name ai.islandspace.top;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-islandspace-top;
        default_type text/plain;
    }

    location / {
        return 301 https://ai.islandspace.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ai.islandspace.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ai.islandspace.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.islandspace.top/privkey.pem;

    client_max_body_size 15m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
