# 独立站点：只用于 ai.islandspace.top 申请证书之前。
# 不要并进 islandspace.top 或 admin.islandspace.top，不要反代 8000，不要修改 zxd-backend。

server {
    listen 80;
    server_name ai.islandspace.top;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-islandspace-top;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 404 "ai.islandspace.top certificate is not installed\n";
    }
}
